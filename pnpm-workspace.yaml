allowBuilds:
  esbuild: true
# @haverstack/* publish frequently enough to land inside a minimumReleaseAge
# supply-chain policy window; excluded so a fresh release still installs.
minimumReleaseAgeExclude:
  - '@haverstack/adapter-api@0.36.0'
  - '@haverstack/adapter-local@0.36.0'
  - '@haverstack/blob-adapter-disk@0.35.0'
  - '@haverstack/commons@0.31.0'
  - '@haverstack/core@0.37.0'
  - '@haverstack/record-adapter-sqlite@0.29.0'
  - '@haverstack/wire-types@0.36.0'
  - '@haverstack/server@0.10.3'
