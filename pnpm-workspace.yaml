allowBuilds:
  esbuild: true
# @haverstack/* publish frequently enough to land inside a minimumReleaseAge
# supply-chain policy window; excluded so a fresh release still installs.
minimumReleaseAgeExclude:
  - '@haverstack/adapter-api@0.25.0'
  - '@haverstack/adapter-local@0.25.0'
  - '@haverstack/blob-adapter-disk@0.24.0'
  - '@haverstack/core@0.26.0'
  - '@haverstack/record-adapter-sqlite@0.18.0'
  - '@haverstack/wire-types@0.25.0'
