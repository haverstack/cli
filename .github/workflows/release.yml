name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # npm's OIDC Trusted Publishing needs npm >= 11.5.1; setup-node ships older.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # Pending changesets -> open/update a "chore: version packages" PR.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No pending changesets (the version PR just merged, or nothing to do) ->
      # publish. `changeset publish` no-ops when the version is already on npm.
      # Auth is the repo's Trusted Publisher (OIDC) — no NPM_TOKEN.
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
